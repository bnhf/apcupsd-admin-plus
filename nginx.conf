user www-data;
worker_processes 1;
pid /run/nginx.pid;

events {
        worker_connections 64;
}

http {


        # Basic Settings


        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 10;

        include /etc/nginx/mime.types;
        default_type application/octet-stream;


        # Logging Settings
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        # FastCGI cache -- serves cached CGI output for 30s to avoid polling every UPS on each request
        fastcgi_cache_path /tmp/nginx_cache levels=1:2 keys_zone=apcupsd_cache:1m max_size=10m inactive=60s;
        fastcgi_cache_key "$scheme$request_method$host$request_uri";

        server {
            listen 80 default_server;
            #listen [::]:80 default_server;

            root /usr/lib/cgi-bin/apcupsd/;

            fastcgi_index multimon.cgi;

            server_name _;

            location / {
                    # First attempt to serve request as file, then
                    # as directory, then fall back to displaying a 404.
                    try_files $uri $uri/ =404;
                    gzip off;
                    fastcgi_pass  unix:/var/run/fcgiwrap.socket;
                    include /etc/nginx/fastcgi_params;
                    fastcgi_param SCRIPT_FILENAME  $document_root$fastcgi_script_name;
                    fastcgi_connect_timeout 5s;
                    fastcgi_read_timeout 15s;
                    fastcgi_cache apcupsd_cache;
                    fastcgi_cache_valid 200 30s;
                    fastcgi_cache_use_stale error timeout updating;
            }
        }
}
